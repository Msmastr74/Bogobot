[project]
name = "bogobot"
version = "1.0"
description = "Bogobot is a specialized Discord bot designed for monitoring the [24/7 Bogosort Livestream](https://www.youtube.com/live/DwbZpZxGEA0). The bot uses OCR and stream-derived timing to provide high-accuracy statistics directly from the stream."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.13.5",
    "discord-py>=2.7.1",
    "openai>=2.8.0",
    "numpy>=2.2.6",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pyuca>=1.2",
    "streamlink>=8.4.0",
    "pytchat>=0.5.5",
    "google-api-python-client>=2.197.0",
    "google-auth>=2.53.0",
    "google-auth-oauthlib>=1.4.0",
    "google-auth-httplib2>=0.4.0",
    "pydantic>=2.13.0",
]
